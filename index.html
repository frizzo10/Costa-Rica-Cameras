<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Costa Rica Cameras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0; --panel:#FFFFFF; --line:#E2DED6;
    --text:#1A1A1A; --muted:#8C8578;
    --person:#C4620A; --vehicle:#2668A8; --animal:#1A7D42;
    --noise:#A8A198; --urgent:#C42B1C;
    --accent:#1A7D42;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;padding:20px 16px;max-width:880px;margin:0 auto;
  }

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{flex-shrink:0}
  h1{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;color:var(--text)}
  h1 em{font-style:normal;color:var(--accent);font-weight:600}
  .live{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--accent);
    display:flex;align-items:center;gap:6px;
    background:#E8F5ED;padding:4px 10px;border-radius:999px}
  .live::before{content:"";width:6px;height:6px;border-radius:50%;
    background:var(--accent);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media(prefers-reduced-motion:reduce){.live::before{animation:none}}

  /* ---------- stats strip ---------- */
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 14px;font-size:.82rem;color:var(--muted);box-shadow:var(--shadow)}
  .stat b{color:var(--text);font-weight:700;margin-right:4px;font-size:.95rem}

  /* ---------- controls ---------- */
  .controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .controls h2{font-size:.75rem;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em}
  .toggle{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:5px 14px;cursor:pointer;box-shadow:var(--shadow);transition:all .15s}
  .toggle.on{color:var(--accent);border-color:var(--accent);background:#E8F5ED}
  .toggle:hover{border-color:var(--accent)}
  .toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- alert log ---------- */
  .log{display:flex;flex-direction:column;gap:8px}
  .row{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;font-size:.85rem;box-shadow:var(--shadow);
    display:grid;grid-template-columns:auto 1fr;gap:4px 16px;cursor:pointer;
    transition:border-color .15s
  }
  .row:hover{border-color:#C8C3BA}
  .row.urgent{border-left:3px solid var(--urgent)}
  .ts{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;grid-column:1}
  .cam{color:var(--text);font-weight:700;grid-column:1;text-transform:uppercase;
    font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.04em}
  .meta{grid-column:2;grid-row:1/span 2;display:flex;flex-direction:column;gap:6px}
  .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;border:1.5px solid}
  .chip.person{color:var(--person);border-color:var(--person);background:#FEF3E8}
  .chip.vehicle{color:var(--vehicle);border-color:var(--vehicle);background:#EBF3FC}
  .chip.animal{color:var(--animal);border-color:var(--animal);background:#E8F5ED}
  .chip.false_alarm,.chip.unclear,.chip.unknown{color:var(--noise);border-color:var(--noise);background:#F3F1ED}
  .pips{color:var(--muted);font-size:.7rem;letter-spacing:2px}
  .pips .hot{color:var(--urgent)}
  .sum{color:var(--text);font-size:.88rem;line-height:1.45}
  .sent{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:.66rem}
  .snap{margin-top:10px;border-radius:8px;max-width:100%;border:1px solid var(--line);display:none}
  .row.open .snap{display:block}

  .empty{border:2px dashed var(--line);border-radius:var(--radius);
    padding:40px 20px;text-align:center;color:var(--muted);
    font-size:.88rem;line-height:1.7;background:var(--panel)}
  .empty code{font-family:'JetBrains Mono',monospace;color:var(--text);
    font-size:.76rem;background:#EDEAE4;padding:2px 6px;border-radius:4px}

  footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);
    display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="7" fill="#1A7D42"/>
      <circle cx="14" cy="12" r="5" stroke="#fff" stroke-width="1.8" fill="none"/>
      <circle cx="14" cy="12" r="1.8" fill="#fff"/>
      <rect x="9" y="18" width="10" height="3" rx="1.5" fill="#fff" opacity=".7"/>
    </svg>
    <h1>Costa Rica <em>Cameras</em></h1>
  </div>
  <div class="live" id="liveLabel">watching</div>
</header>

<div class="stats" id="stats"></div>

<div class="controls">
  <h2>Alert log</h2>
  <button class="toggle on" id="noiseToggle">hiding false alarms</button>
</div>

<div class="log" id="log">
  <div class="empty">Connecting…</div>
</div>

<footer>
  <span>Tinamastes · Costa Rica</span>
  <span id="lastSync"></span>
</footer>

<script>
const SUPABASE_URL = "https://qruccaoyszgftgicdfxq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFydWNjYW95c3pnZnRnaWNkZnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODkzOTgsImV4cCI6MjA5Njc2NTM5OH0.UmBbWAV4Scm02pgZfvbxkqtlRfxwEtC7-4Ib2xv0f6k";

let hideNoise = true;
let alerts = [];

const $log = document.getElementById("log");
const $stats = document.getElementById("stats");
const $toggle = document.getElementById("noiseToggle");
const $sync = document.getElementById("lastSync");

$toggle.addEventListener("click", () => {
  hideNoise = !hideNoise;
  $toggle.classList.toggle("on", hideNoise);
  $toggle.textContent = hideNoise ? "hiding false alarms" : "showing everything";
  render();
});

async function fetchAlerts() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/deck_alerts?select=*&order=created_at.desc&limit=100`,
      { headers: { apikey: SUPABASE_ANON_KEY, authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if (!res.ok) throw new Error(res.status);
    alerts = await res.json();
    $sync.textContent = "synced " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    render();
  } catch (e) {
    $log.innerHTML = `<div class="empty">Couldn't reach Supabase.<br>
      Check <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> at the top of index.html.</div>`;
  }
}

function render() {
  const shown = hideNoise
    ? alerts.filter(a => a.category !== "false_alarm")
    : alerts;

  const today = new Date().toDateString();
  const todays = alerts.filter(a => new Date(a.created_at).toDateString() === today);
  const filtered = todays.filter(a => a.category === "false_alarm").length;
  const real = todays.filter(a => a.category !== "false_alarm").length;
  $stats.innerHTML = `
    <div class="stat"><b>${todays.length}</b>events today</div>
    <div class="stat"><b>${filtered}</b>false alarms filtered</div>
    <div class="stat"><b>${real}</b>real alerts</div>`;

  if (!shown.length) {
    $log.innerHTML = `<div class="empty">All quiet. 🌴<br><br>
      Alerts appear here the moment a camera triggers the AI pipeline.<br>
      Send a test email with a photo to your CloudMailin address to try it.</div>`;
    return;
  }

  $log.innerHTML = shown.map(a => {
    const t = new Date(a.created_at);
    const lvl = a.threat_level || 1;
    const pips = Array.from({length:3}, (_,i) =>
      `<span class="${i < lvl && lvl === 3 ? "hot" : ""}">${i < lvl ? "●" : "○"}</span>`).join("");
    return `
    <div class="row ${lvl === 3 ? "urgent" : ""}" data-id="${a.id}" role="button" tabindex="0"
         aria-label="Alert from ${esc(a.camera)}">
      <div class="ts">${t.toLocaleDateString([], {month:"short",day:"numeric"})} ${t.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div>
      <div class="cam">${esc(a.camera || "camera")}</div>
      <div class="meta">
        <div class="chips">
          <span class="chip ${esc(a.category)}">${esc((a.category||"event").replace("_"," "))}</span>
          <span class="pips">${pips}</span>
          ${a.notified ? `<span class="sent">✓ notified</span>` : ""}
        </div>
        <div class="sum">${esc(a.summary || "")}</div>
        ${a.snapshot_url ? `<img class="snap" loading="lazy" src="${esc(a.snapshot_url)}" alt="Snapshot from ${esc(a.camera)}">` : ""}
      </div>
    </div>`;
  }).join("");

  $log.querySelectorAll(".row").forEach(row => {
    const open = () => row.classList.toggle("open");
    row.addEventListener("click", open);
    row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
}

function esc(s){return String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

fetchAlerts();
setInterval(fetchAlerts, 20000);
</script>
</body>
</html>
